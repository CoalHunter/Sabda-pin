name: Sabda Audio Generator

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Audio Generator
        id: bot
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python main.py

      - name: Commit Generated Audio
        if: success()
        run: |
          git config --global user.name 'Sabda Bot'
          git config --global user.email 'bot@sabda.com'
          git add *.mp3
          git commit -m "chore: generate audio for ${{ github.event.issue.title }}"
          git push

      - name: Comment on Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "${{ steps.bot.outputs.RESULT }}"
          if [ "${{ job.status }}" == "success" ]; then
            gh issue close ${{ github.event.issue.number }}
          fi
