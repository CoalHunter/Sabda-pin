name: Sabda YouTube Generator

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate-video-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Generator
        id: bot
        env:
          ISSUE_TEXT: ${{ github.event.issue.title }} ${{ github.event.issue.body }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit Generated Files
        if: success()
        run: |
          git config --global user.name 'Sabda Bot'
          git config --global user.email 'bot@sabda.com'
          git add naskah.txt audio.mp3 metadata.txt
          git commit -m "chore: generate assets for ${{ github.event.issue.title }}"
          git push

      - name: Comment on Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "${{ steps.bot.outputs.RESULT }}"
          if [ "${{ job.status }}" == "success" ]; then
            gh issue close ${{ github.event.issue.number }}
          fi
